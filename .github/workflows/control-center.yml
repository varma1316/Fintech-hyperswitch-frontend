name: Build & Deploy Control Center Dashboard

on:
  push:
    branches:
      - master
    paths:
      - 'control-center/**'
      - '.github/workflows/control-center.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'control-center/**'
      - '.github/workflows/control-center.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Control Center
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Retrieve Infrastructure Secrets from AWS Secrets Manager
        id: fetch-secrets
        run: |
          echo "Fetching frontend infra configurations from AWS Secrets Manager..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "hyperswitch/infra" --query SecretString --output text 2>/dev/null || echo "{}")
          
          S3_BUCKET=$(echo "$SECRET_JSON" | jq -r '.S3_BUCKET // .s3_bucket_name // empty')
          if [ -z "$S3_BUCKET" ]; then
            echo "S3_BUCKET not found in secret, using default hyperswitch-frontend-assets"
            S3_BUCKET="hyperswitch-frontend-assets"
          fi
          
          CF_DIST_ID=$(echo "$SECRET_JSON" | jq -r '.CLOUDFRONT_DISTRIBUTION_ID // .cloudfront_distribution_id // empty')
          if [ -z "$CF_DIST_ID" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID not in secret, looking up via CloudFront API..."
            CF_DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='CloudFront distribution for Hyperswitch Multi-SPA frontends'].Id | [0]" --output text 2>/dev/null || echo "")
          fi

          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "cf_dist_id=$CF_DIST_ID" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'control-center/package-lock.json'

      - name: Install Dependencies
        run: |
          cd control-center
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Dashboard
        run: |
          cd control-center
          npm run build:prod || npm run build:custom || npm run build:common

      - name: Determine Output Directory & Deploy to S3 (/control-center/)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          BUILD_DIR="control-center/dist/hyperswitch"
          if [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR="control-center/dist"
          fi
          echo "Deploying from $BUILD_DIR to s3://${{ steps.fetch-secrets.outputs.s3_bucket }}/control-center/..."
          aws s3 sync "$BUILD_DIR" "s3://${{ steps.fetch-secrets.outputs.s3_bucket }}/control-center/" --delete

      - name: Invalidate CloudFront Cache
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.fetch-secrets.outputs.cf_dist_id != ''
        run: |
          echo "Invalidating CloudFront cache for distribution ${{ steps.fetch-secrets.outputs.cf_dist_id }}..."
          aws cloudfront create-invalidation --distribution-id "${{ steps.fetch-secrets.outputs.cf_dist_id }}" --paths "/control-center/*"
