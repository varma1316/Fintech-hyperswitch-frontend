name: Build & Deploy E-Commerce Storefront

on:
  push:
    branches:
      - master
    paths:
      - 'ecommerce-store/**'
      - '.github/workflows/ecommerce-store.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'ecommerce-store/**'
      - '.github/workflows/ecommerce-store.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-deploy:
    name: Build & Deploy Storefront
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Retrieve Infrastructure Secrets from AWS Secrets Manager
        id: fetch-secrets
        run: |
          echo "Fetching frontend infra configurations from AWS Secrets Manager..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "hyperswitch/infra" --query SecretString --output text 2>/dev/null || echo "{}")
          
          S3_BUCKET=$(echo "$SECRET_JSON" | jq -r '.S3_BUCKET // .s3_bucket_name // empty')
          if [ -z "$S3_BUCKET" ]; then
            echo "S3_BUCKET not found in secret, using default hyperswitch-frontend-assets"
            S3_BUCKET="hyperswitch-frontend-assets"
          fi
          
          CF_DIST_ID=$(echo "$SECRET_JSON" | jq -r '.CLOUDFRONT_DISTRIBUTION_ID // .cloudfront_distribution_id // empty')
          if [ -z "$CF_DIST_ID" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID not in secret, looking up via CloudFront API..."
            CF_DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='CloudFront distribution for Hyperswitch Multi-SPA frontends'].Id | [0]" --output text 2>/dev/null || echo "")
          fi

          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "cf_dist_id=$CF_DIST_ID" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd ecommerce-store
          npm install --legacy-peer-deps

      - name: Build Storefront (Vite)
        run: |
          cd ecommerce-store
          npm run build

      - name: Deploy to S3 (Root /)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Syncing build artifacts to s3://${{ steps.fetch-secrets.outputs.s3_bucket }}/..."
          aws s3 sync ecommerce-store/dist "s3://${{ steps.fetch-secrets.outputs.s3_bucket }}/" --delete

      - name: Invalidate CloudFront Cache
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.fetch-secrets.outputs.cf_dist_id != ''
        run: |
          echo "Invalidating CloudFront cache for distribution ${{ steps.fetch-secrets.outputs.cf_dist_id }}..."
          aws cloudfront create-invalidation --distribution-id "${{ steps.fetch-secrets.outputs.cf_dist_id }}" --paths "/*"
